name: Addon Approval Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - feature-patch1
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number that was merged'
        required: true

concurrency:
  group: addon-approval-merge-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:

  update-release-file:
    if: >
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature-patch-')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: none

    concurrency:
      group: update-release-file-feature-patch1
      cancel-in-progress: false

    steps:
      - name: Checkout feature-patch1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: feature-patch1
          token: ${{ secrets.PAT_TOKEN }}

      - name: Sync next.yml to addon-release-next.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp next.yml addon-release-next.yaml
          git add addon-release-next.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync addon-release-next.yaml from next.yml"
          git push origin feature-patch1
          echo "addon-release-next.yaml updated on feature-patch1"
