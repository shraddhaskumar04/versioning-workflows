name: Addon Approval Merge

on:
  pull_request_review:
    types:
      - submitted
  pull_request:
    types:
      - closed
    branches:
      - feature-patch1
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number that was merged'
        # Changed from required: false — prevents premature release-file
        # promotion when triggered manually without a real merged PR.
        required: true

concurrency:
  group: addon-approval-merge-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:

  check-and-merge:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'feature-patch1' &&
      startsWith(github.event.pull_request.head.ref, 'feature-patch-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: none

    # Per-PR concurrency prevents double-merge if two approvals arrive quickly
    concurrency:
      group: approval-merge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout feature-patch1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: feature-patch1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if reviewer is codeowner and merge
        env:
          # PAT_TOKEN used instead of GITHUB_TOKEN so that branch-protection
          # rules are respected during merge (--admin has been removed).
          # Assumption: PAT_TOKEN is scoped to contents:write on this repo only.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Validate reviewer login before using in grep pattern
          if ! echo "$REVIEWER" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9-]*$'; then
            echo "ERROR: Unexpected reviewer login format: $REVIEWER"
            exit 1
          fi

          # Note: this parser handles individual @user entries only.
          # @org/team entries are not supported. If team ownership is
          # added to CODEOWNERS, this parser must be updated.
          CODEOWNERS=$(grep -v '^#' .github/CODEOWNERS | grep -v '^$' | \
            grep -oP '(?<=\s|^)@\K[a-zA-Z0-9][a-zA-Z0-9-]*(?!\/)')

          echo "Reviewer: $REVIEWER"
          echo "Codeowners: $CODEOWNERS"

          if ! echo "$CODEOWNERS" | grep -q "^${REVIEWER}$"; then
            echo "FAIL: $REVIEWER is NOT a codeowner — blocking merge"
            exit 1
          fi

          echo "OK: $REVIEWER is a codeowner — merging PR #${PR_NUMBER}"
          # --admin removed: branch-protection rules still apply.
          # If this fails due to unsatisfied checks, resolve those checks
          # rather than bypassing protection.
          gh pr merge "$PR_NUMBER" --merge

  update-release-file:
    if: >
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature-patch-')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: none

    # Prevents two near-simultaneous close events or a close + manual dispatch
    # from racing and clobbering each other on feature-patch1.
    concurrency:
      group: update-release-file-feature-patch1
      cancel-in-progress: false

    steps:
      - name: Checkout feature-patch1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: feature-patch1
          # PAT required: branch protection on feature-patch1 blocks
          # GITHUB_TOKEN direct pushes. Assumption: PAT_TOKEN is scoped
          # to contents:write on this repo only.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Sync next.yml to addon-release-next.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp next.yml addon-release-next.yaml
          git add addon-release-next.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync addon-release-next.yaml from next.yml"
          git push origin feature-patch1
          echo "addon-release-next.yaml updated on feature-patch1"
