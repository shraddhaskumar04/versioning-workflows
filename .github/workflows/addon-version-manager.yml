name: Addon Version Manager

on:
  workflow_dispatch:
    inputs:
      addon_name:
        description: 'Addon name (e.g. async-message-svc)'
        required: true
      addon_version:
        description: 'New version (e.g. 2.3.2)'
        required: true

concurrency:
  # Namespace by addon so different addons can run in parallel
  group: addon-version-manager-${{ github.event.inputs.addon_name || github.ref }}
  cancel-in-progress: false

jobs:

  update-next-yml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: none

    steps:
      - name: Checkout feature-patch1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: feature-patch1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update next.yml with new version
        env:
          ADDON: ${{ github.event.inputs.addon_name }}
          VERSION: ${{ github.event.inputs.addon_version }}
        run: |
          # Validate inputs are safe before interpolating into yq expressions
          if ! echo "$ADDON" | grep -qE '^[a-zA-Z0-9_-]+$'; then
            echo "ERROR: Invalid addon name format: $ADDON"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "ERROR: Invalid version format: $VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Updating $ADDON to $VERSION"

          if ! yq "has(\"${ADDON}\")" next.yml | grep -q "true"; then
            echo "Addon $ADDON not found in next.yml"
            exit 1
          fi

          yq -i ".\"${ADDON}\" = \"${VERSION}\"" next.yml

          echo "Updated next.yml:"
          cat next.yml

          git add next.yml
          git diff --staged --quiet && echo "No version change detected" && exit 0
          git commit -m "chore: update ${ADDON} to ${VERSION} via workflow_dispatch"
          git push origin feature-patch1
          echo "next.yml updated and pushed"

  create-branch:
    needs: [update-next-yml]
    if: needs.update-next-yml.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: none
    outputs:
      source_branch: ${{ steps.branch_names.outputs.source_branch }}

    steps:
      - name: Checkout feature-patch1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: feature-patch1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dynamic source branch off HEAD~1
        # HEAD~1 is intentional: the source branch is one commit behind
        # feature-patch1 so the resulting PR diff shows exactly the
        # version-bump commit.
        id: branch_names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          SOURCE_BRANCH="feature-patch-${TIMESTAMP}"

          git checkout HEAD~1 -b "$SOURCE_BRANCH"
          git push origin "$SOURCE_BRANCH"
          echo "Branch $SOURCE_BRANCH created off HEAD~1 of feature-patch1"

          echo "source_branch=${SOURCE_BRANCH}" >> $GITHUB_OUTPUT

  sync-and-pr:
    needs: create-branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: none
    env:
      SOURCE_BRANCH: ${{ needs.create-branch.outputs.source_branch }}
      TARGET_BRANCH: feature-patch1

    steps:
      - name: Checkout feature-patch1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: feature-patch1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Detect changes in next.yml and build PR content
        id: diff
        env:
          ACTOR: ${{ github.actor }}
        run: |
          CHANGED_ADDONS=""
          FINAL_TYPE="fix"

          echo "## Current Version Bump" > pr_body.md
          echo "" >> pr_body.md
          echo "| Addon | Old Version | New Version | Change Type |" >> pr_body.md
          echo "|-------|-------------|-------------|-------------|" >> pr_body.md

          while IFS= read -r ADDON; do
            NEW=$(yq ".\"${ADDON}\"" next.yml)
            OLD=$(git show HEAD~1:next.yml | yq ".\"${ADDON}\"" 2>/dev/null || echo "none")

            [ "$OLD" = "$NEW" ] && continue
            [ "$OLD" = "null" ] && OLD="none"

            OLD_CLEAN="${OLD#v}"
            NEW_CLEAN="${NEW#v}"
            OLD_MAJOR=$(echo "$OLD_CLEAN" | cut -d. -f1)
            OLD_MINOR=$(echo "$OLD_CLEAN" | cut -d. -f2)
            NEW_MAJOR=$(echo "$NEW_CLEAN" | cut -d. -f1)
            NEW_MINOR=$(echo "$NEW_CLEAN" | cut -d. -f2)

            if [ "$NEW_MAJOR" != "$OLD_MAJOR" ]; then
              CHANGE_LEVEL="MAJOR"
              FINAL_TYPE="feat!"
            elif [ "$NEW_MINOR" != "$OLD_MINOR" ]; then
              CHANGE_LEVEL="MINOR"
              [ "$FINAL_TYPE" != "feat!" ] && FINAL_TYPE="feat"
            else
              CHANGE_LEVEL="PATCH"
            fi

            CHANGED_ADDONS="${CHANGED_ADDONS}${ADDON} "
            echo "| \`${ADDON}\` | \`${OLD}\` | \`${NEW}\` | **${CHANGE_LEVEL}** |" >> pr_body.md

          done < <(yq 'keys | .[]' next.yml)

          if [ -z "$CHANGED_ADDONS" ]; then
            echo "No changes detected in next.yml"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          ADDONS_SHORT=$(echo "$CHANGED_ADDONS" | xargs)
          COMMIT_TITLE="${FINAL_TYPE}(addons): bump versions [${ADDONS_SHORT}]"

          echo "" >> pr_body.md
          echo "**Commit:** \`${COMMIT_TITLE}\`" >> pr_body.md
          echo "" >> pr_body.md
          echo "**Triggered by:** @${ACTOR}" >> pr_body.md

          echo "" >> pr_body.md
          echo "## Cumulative Changes Since Last Release" >> pr_body.md
          echo "" >> pr_body.md

          LAST_RELEASE_COMMIT=$(git log --oneline -- addon-release-next.yaml | head -1 | awk '{print $1}')

          if [ -z "$LAST_RELEASE_COMMIT" ]; then
            echo "_No previous release found_" >> pr_body.md
          else
            echo "_Comparing against last release commit: \`${LAST_RELEASE_COMMIT}\`_" >> pr_body.md
            echo "" >> pr_body.md
            echo "### Commits to next.yml since last release" >> pr_body.md
            echo '```' >> pr_body.md
            git log --oneline "${LAST_RELEASE_COMMIT}..HEAD" -- next.yml >> pr_body.md
            echo '```' >> pr_body.md
            echo "" >> pr_body.md

            if [ ! -f addon-release-next.yaml ]; then
              echo "_addon-release-next.yaml not found — skipping cumulative delta_" >> pr_body.md
            else
              echo "### Cumulative Version Delta" >> pr_body.md
              echo "" >> pr_body.md
              echo "| Addon | Released Version | Current Version | Change Type |" >> pr_body.md
              echo "|-------|-----------------|-----------------|-------------|" >> pr_body.md

              while IFS= read -r ADDON; do
                RELEASED=$(yq ".\"${ADDON}\"" addon-release-next.yaml)
                CURRENT=$(yq ".\"${ADDON}\"" next.yml)
                [ "$RELEASED" = "$CURRENT" ] && continue
                [ "$RELEASED" = "null" ] && RELEASED="none"

                REL_CLEAN="${RELEASED#v}"
                CUR_CLEAN="${CURRENT#v}"
                REL_MAJOR=$(echo "$REL_CLEAN" | cut -d. -f1)
                REL_MINOR=$(echo "$REL_CLEAN" | cut -d. -f2)
                CUR_MAJOR=$(echo "$CUR_CLEAN" | cut -d. -f1)
                CUR_MINOR=$(echo "$CUR_CLEAN" | cut -d. -f2)

                if [ "$CUR_MAJOR" != "$REL_MAJOR" ]; then
                  CUM_CHANGE="MAJOR"
                elif [ "$CUR_MINOR" != "$REL_MINOR" ]; then
                  CUM_CHANGE="MINOR"
                else
                  CUM_CHANGE="PATCH"
                fi

                echo "| \`${ADDON}\` | \`${RELEASED}\` | \`${CURRENT}\` | **${CUM_CHANGE}** |" >> pr_body.md
              done < <(yq 'keys | .[]' next.yml)
            fi
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

          # Use GITHUB_OUTPUT multiline delimiter instead of /tmp file
          EOF_MARKER=$(openssl rand -hex 8)
          echo "commit_msg<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_TITLE"             >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}"             >> "$GITHUB_OUTPUT"

      - name: Copy next.yml to source branch
        if: steps.diff.outputs.has_changes == 'true'
        env:
          COMMIT_MSG: ${{ steps.diff.outputs.commit_msg }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$SOURCE_BRANCH"
          git checkout "$SOURCE_BRANCH"
          git checkout feature-patch1 -- next.yml
          git add next.yml
          git diff --staged --quiet && echo "Nothing to commit on $SOURCE_BRANCH" && exit 0
          git commit -m "$COMMIT_MSG"
          git push origin "$SOURCE_BRANCH"

      - name: Install gh CLI
        run: |
          type gh >/dev/null 2>&1 && exit 0
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
            sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
            sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q gh

      - name: Raise PR and request codeowner reviews
        if: steps.diff.outputs.has_changes == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ steps.diff.outputs.commit_msg }}
        run: |
          # Note: this parser handles individual @user entries only.
          # @org/team entries are not supported. If team ownership is
          # added to CODEOWNERS, this parser must be updated.
          REVIEWERS=$(grep -v '^#' .github/CODEOWNERS | grep -v '^$' | \
            grep -oP '(?<=\s|^)@\K[a-zA-Z0-9][a-zA-Z0-9-]*(?!\/)' | \
            tr '\n' ',' | sed 's/,$//')

          echo "Reviewers: $REVIEWERS"

          if [ -z "$REVIEWERS" ]; then
            echo "No reviewers found in CODEOWNERS — creating PR without reviewers"
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "$COMMIT_MSG" \
              --body-file pr_body.md
          else
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "$COMMIT_MSG" \
              --body-file pr_body.md \
              --reviewer "$REVIEWERS"
          fi || {
            echo "PR creation failed or PR already exists — looking up existing PR"
          }

          PR_NUMBER=$(gh pr list \
            --head "$SOURCE_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "ERROR: Could not determine PR number"
            exit 1
          fi

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "Detected PR number: ${PR_NUMBER}"

      - name: Generate and commit PR details JSON for internal UI
        if: steps.diff.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ steps.diff.outputs.commit_msg }}
        run: |
          # SECURITY NOTE: merge_api and approve_api instructions have been
          # removed from this file. The internal UI should use its own
          # stored credentials and construct API calls server-side.

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin feature-patch1
          git checkout feature-patch1
          git pull origin feature-patch1

          # Use jq to build JSON — handles all escaping correctly,
          # no manual sanitisation needed.
          jq -n \
            --argjson pr    "$PR_NUMBER" \
            --arg     url   "https://github.com/${REPO}/pull/${PR_NUMBER}" \
            --arg     title "$COMMIT_MSG" \
            --arg     actor "$ACTOR" \
            --arg     repo  "$REPO" \
            '{
              pr_number: $pr,
              pr_url:    $url,
              title:     $title,
              raised_by: $actor,
              repo:      $repo,
              status:    "open"
            }' > .github/pr-details.json

          git add .github/pr-details.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update pr-details.json for internal UI"
          git push origin feature-patch1
          echo "pr-details.json committed to feature-patch1"
